name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.txt; echo "EXIT CODE: ${PIPESTATUS[0]}" >> build-output.txt

      - name: Upload Build Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build-output.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: oghirides-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
