name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace > gradle-output.txt 2>&1
          echo "=== EXIT CODE: $? ===" >> gradle-output.txt

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: gradle-output.txt

      - name: Fail if build failed
        if: always()
        run: |
          if [ -f gradle-output.txt ] && grep -q "BUILD FAILED" gradle-output.txt; then
            echo "Build failed! Full output below:"
            cat gradle-output.txt | tail -100
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oghirides-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create Release
        if: success()
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ github.run_number }}"
          name: "OghiRides v${{ github.run_number }}"
          body: "Auto-update release"
          artifacts: "app/build/outputs/apk/debug/app-debug.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
